name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR cancels any still-running CI for that same PR so we
# don't waste minutes on stale commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # sqlite-vec needs a system SQLite built with loadable extensions.
      # Apple's bundled libsqlite3 does NOT qualify on macOS runners, and
      # Ubuntu's minimal image on GitHub-hosted runners omits libsqlite3-dev.
      # The candidate-path list in src/storage/sqlite.ts picks the right
      # binary automatically once these land.
      - name: Install system SQLite (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      - name: Install system SQLite (macOS)
        if: runner.os == 'macOS'
        run: brew install sqlite

      - name: Install deps (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test
