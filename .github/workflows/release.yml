name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual dispatch is handy for rebuilding a tag after a release.yml fix
  # without cutting a new version number.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target.name }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: darwin-arm64
            os: macos-latest
            bun: bun-darwin-arm64
          - name: linux-x86_64
            os: ubuntu-latest
            bun: bun-linux-x64
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps (frozen lockfile)
        run: bun install --frozen-lockfile

      # Regenerate the build-time manifests so the compiled binary
      # carries (a) every migration as a bundled text-import and (b)
      # the host platform's sqlite-vec native library as a bundled
      # asset. Both files live at src/storage/*.generated.ts; the
      # committed versions are stubs / dev-platform-specific, and CI
      # MUST regenerate before bun --compile or the binary will crash
      # at first `kg init` (missing migrations) or `kg embed`
      # (missing vec0 native lib).
      - name: Regenerate bundle manifests
        run: |
          bun scripts/gen-migrations-manifest.ts
          bun scripts/gen-sqlite-vec-native.ts

      # bun build --compile produces a single-file executable with the
      # Bun runtime embedded. The resulting binary still loads the host's
      # system libsqlite3 at runtime (via sqlite-vec's Database.setCustomSQLite),
      # so end users still need `brew install sqlite` / `apt install libsqlite3-dev`.
      # We do NOT need system SQLite at build time — the compile step only
      # bundles JS + TS sources + the assets pulled in by the manifests above.
      - name: Compile kg binary
        run: |
          mkdir -p dist
          bun build ./src/cli/kg.ts \
            --compile \
            --target=${{ matrix.target.bun }} \
            --outfile dist/kg-${{ matrix.target.name }}
          chmod +x dist/kg-${{ matrix.target.name }}
          ls -la dist/

      # macOS: bun --compile emits an ad-hoc "linker-signed" Mach-O, which
      # current macOS rejects at launch when the binary wasn't built on
      # the local machine (exit 137 / SIGKILL). Replace with an ordinary
      # ad-hoc signature via `codesign --sign -` so any arm64 Mac can
      # run the release binary. Proper Developer ID notarization is
      # parked for v0.2 (see TODO.md → Week 6).
      - name: Ad-hoc codesign (macOS only)
        if: runner.os == 'macOS'
        run: |
          # bun --compile emits `adhoc,linker-signed` metadata that
          # codesign on the GitHub macos-latest runner refuses to
          # replace in place ("invalid or unsupported format for
          # signature"). Strip the linker signature first, then apply
          # a plain ad-hoc sig. `--remove-signature` tolerates the
          # existing linker-signed data; the `|| true` is belt-and-
          # suspenders for runner versions that would fail the strip.
          codesign --remove-signature dist/kg-${{ matrix.target.name }} || true
          codesign --force --sign - dist/kg-${{ matrix.target.name }}
          codesign --verify --verbose dist/kg-${{ matrix.target.name }}

      # Smoke tests run natively on the matching runner (macos-latest is
      # arm64, ubuntu-latest is x64). --version checks that the binary
      # boots at all; doctor exercises the bundle extraction path
      # (migrations.generated.ts + sqlite-vec-native.generated.ts),
      # catches regressions where the bundled assets stop reaching the
      # /$bunfs filesystem.
      - name: System SQLite for smoke (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libsqlite3-dev
      - name: System SQLite for smoke (macOS)
        if: runner.os == 'macOS'
        run: brew install sqlite
      - name: Smoke test --version + doctor
        env:
          # Use a fresh tmp DB so doctor hits the in-memory pre-init
          # vec probe path (the one most likely to regress on a
          # bundle-extraction bug).
          ORGMEM_DB: ${{ runner.temp }}/orgmem-smoke.db
        run: |
          dist/kg-${{ matrix.target.name }} --version
          dist/kg-${{ matrix.target.name }} doctor | tee /tmp/doctor.json
          # Fail loud if vec didn't load — the entire point of v0.1.2.
          grep -q '"vecLoaded": true' /tmp/doctor.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kg-${{ matrix.target.name }}
          path: dist/kg-${{ matrix.target.name }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      # softprops/action-gh-release needs write access to create / update
      # the release under the pushed tag.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # actions/download-artifact@v4 flattens each artifact into its own
      # subdirectory. Collect all of them into a single release/ dir so
      # action-gh-release can glob them in one shot.
      - name: Collect binaries
        run: |
          mkdir -p release
          for d in dist/*/; do
            for f in "$d"*; do
              base=$(basename "$f")
              cp "$f" "release/$base"
              chmod +x "release/$base"
            done
          done
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
